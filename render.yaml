# [학습] Render 배포 설정(Blueprint). Render가 이 파일을 읽어 서비스 설정을 자동으로 채웁니다.
# [학습] 비밀값(sync: false)은 여기 적지 않고, Render 대시보드에서 직접 입력합니다.
services:
  - type: web
    name: siosaku
    runtime: node
    plan: free
    # [학습] 패키지 설치(개발용 vite 포함) → 화면 빌드(dist/). NODE_ENV=production이어도 vite가 설치되도록 --include=dev
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: AUTH_MODE
        value: jwt
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
